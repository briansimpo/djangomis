{% load app_tags %}

<form method="POST" action="{% app_url 'switch_org_unit' %}" x-data class="inline-flex items-center">
    {% csrf_token %}
    <select name="org_unit_id" @change="$el.form.submit()" 
        class="block w-full px-3 py-2 border border-slate-200 rounded-xl bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
        
        <option value="">All Units</option>

        {% for org_unit in org_units %}
            <option value="{{ org_unit.id }}" 
                {% if selected_unit_id|stringformat:"s" == org_unit.id|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ org_unit.name|truncatechars:30 }}
            </option>
        {% endfor %}
    </select>
</form>
