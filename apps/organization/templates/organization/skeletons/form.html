<div class="space-y-6 animate-pulse">

    {% if show_sections %}
        <div class="space-y-2">
            <div class="h-5 w-40 rounded bg-gray-200"></div>
            <div class="h-3 w-64 rounded bg-gray-100"></div>
        </div>
    {% endif %}

    {% for row in rows %}
        <div class="grid grid-cols-{{ columns }} gap-4">

            {% for field in row.fields %}
                <div class="space-y-2">

                    {% if field.has_label %}
                        <div class="h-3 w-24 rounded bg-gray-200"></div>
                    {% endif %}

                    {% if field.is_textarea %}
                        <div class="h-24 w-full rounded bg-gray-100"></div>
                    {% else %}
                        <div class="h-10 w-full rounded bg-gray-100"></div>
                    {% endif %}

                </div>
            {% endfor %}

        </div>
    {% endfor %}

    {% if show_actions %}
        <div class="flex justify-end gap-3 pt-4">
            <div class="h-10 w-20 rounded bg-gray-100"></div>
            <div class="h-10 w-28 rounded bg-gray-200"></div>
        </div>
    {% endif %}

</div>
