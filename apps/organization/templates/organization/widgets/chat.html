<div
    class="chat-widget"
    {{ html_attrs }}
>
    <header class="chat-header">
        <div class="chat-title">
            {{ widget.title }}
        </div>

        {% if conversation %}
            <div class="chat-conversation">
                {{ conversation }}
            </div>
        {% endif %}
    </header>


    <section
        class="chat-messages"
        id="{{ widget.id }}-messages"
    >
        {% if messages %}

            {% for message in messages %}
                <article
                    class="chat-message chat-message--{{ message.role }}"
                >
                    <div class="chat-message__content">
                        {{ message.content }}
                    </div>
                </article>
            {% endfor %}

        {% else %}

            <div class="chat-empty">
                {{ empty_message }}
            </div>

        {% endif %}
    </section>


    <form
        class="chat-form"
        method="post"
        hx-post="{{ widget.endpoint }}"
        hx-target="#{{ widget.id }}"
        hx-swap="outerHTML"
    >
        {% csrf_token %}

        <div class="chat-input">
            <textarea
                name="{{ message_parameter }}"
                placeholder="{{ placeholder }}"
                rows="1"
                required
            ></textarea>

            <button type="submit">
                {{ submit_label }}
            </button>
        </div>
    </form>
</div>
