{% extends 'layouts/base_app.html' %}

{% block content %}
<div class="space-y-6">
    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 pt-4">
        <div>
            <!-- Page Title -->
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">
                Organization Units
            </h1>
        </div>

        <!-- Action / Menu Button -->
        <div class="relative inline-block text-left">
            <div class="flex items-center gap-2">
                <spa-link to="{% app_url 'create_org_unit' %}"  class="btn btn-md btn-primary">
                    Add Unit
                </spa-link>

            </div>

        </div>
    </div>

    <div>
        {% render_widget "organization.org_unit_table" %}
    </div>
</div>
{% endblock %}
