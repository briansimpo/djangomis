{% extends 'layouts/base_app.html' %}

{% block content %}

<form hx-post="{% app_url 'edit_org_unit' pk=object.pk %}" class="flex w-full min-w-0 flex-col gap-4">
    {% csrf_token %}

    {% for field in form %}
        <div class="flex min-w-0 w-full flex-col gap-1.5 text-sm">
            <label for="{{ field.id_for_label }}"
                class="text-sm font-medium text-slate-700">
                {{ field.label }}
            </label>

            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-primary">
        Update
    </button>
</form>

{% endblock %}
