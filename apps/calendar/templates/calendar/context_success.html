{% extends "layouts/base.html" %}

{% block content %}

<div class="container mx-auto max-w-2xl px-6 py-8">

    <div class="mb-8">
        <h1 class="text-2xl font-semibold">
            Academic Context
        </h1>

        <p class="mt-1 text-sm text-gray-600">
            Your academic context has been selected successfully.
        </p>
    </div>


    <div class="rounded-lg border p-6 space-y-6">

        <div>
            <div class="text-sm text-gray-500">
                Organisation Unit
            </div>

            <div class="mt-1 text-lg font-medium">
                {{ org_unit }}
            </div>
        </div>


        <div>
            <div class="text-sm text-gray-500">
                Calendar Period
            </div>

            <div class="mt-1 text-lg font-medium">
                {{ calendar_period }}
            </div>
        </div>

    </div>


    <div class="mt-6 flex gap-3">

        <a
            href="{% url 'calendar:academic-context' %}"
            class="px-4 py-2 rounded-md border"
        >
            Change Context
        </a>

        <a
            href="#"
            class="px-4 py-2 rounded-md border"
        >
            Continue
        </a>

    </div>

</div>

{% endblock %}
