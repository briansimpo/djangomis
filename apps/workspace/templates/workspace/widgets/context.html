<form method="post" action="{{ widget.url }}" class="flex w-full min-w-0 flex-col gap-4">
    {% csrf_token %}

    {% for field in form %}
        <div class="flex min-w-0 w-full flex-col gap-1.5 text-sm">
            <label for="{{ field.id_for_label }}"
                   class="text-sm font-medium text-slate-700">
                {{ field.label }}
            </label>

            {{ field }}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn-sm btn-primary">
        Apply
    </button>
</form>
