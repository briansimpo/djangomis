<div class="fixed bottom-6 left-6 z-[9999] pointer-events-none">
    <div id="htmx-alert" class="flex flex-col gap-3">
        {% if messages %}
            {% for message in messages %}
                <div
                    data-toast
                    data-duration="5000"
                    role="alert"
                    class="pointer-events-auto flex items-center justify-between gap-6 min-w-[360px] max-w-md px-5 py-4 bg-[#202124] text-white border border-white/10 rounded-lg shadow-2xl transition-all transform translate-y-4 opacity-0 duration-300"
                >
                    <!-- Message -->
                    <div class="flex-1 min-w-0">
                        <p class="text-base font-medium leading-relaxed tracking-wide">
                            {{ message|capfirst }}
                        </p>
                    </div>

                    <!-- Dismiss Button -->
                    <button
                        type="button"
                        data-dismiss="toast"
                        class="shrink-0 text-gray-300 hover:text-white transition-colors text-sm font-semibold tracking-wide uppercase px-2 py-1 rounded hover:bg-white/10 focus:outline-none"
                        aria-label="Dismiss notification">
                        Dismiss
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    </div>
</div>
