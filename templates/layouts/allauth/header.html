{% load static %}

<nav class="w-full transition-all duration-300 glass-panel  border-b border-slate-100 bg-white/80 backdrop-blur-md sticky top-0 z-50">
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="flex justify-between items-center h-24">
			<div class="flex items-center space-x-3">
				<a href="{% url 'school:home' %}" class="flex items-center justify-center">
					<div>
						{% if tenant.site.logo %}
							<img src="{{ tenant.site.logo_url }}" alt="Logo" class="w-full h-24 object-contain">
						{% endif %}
					</div>
					<div class="sm:block px-2">
						<h1 class="text-lg font-semibold">{{ tenant.name }} </h1>
						<p class="text text-gray-500">{{tenant.site.title}}</p>
					</div>
				</a>
			</div>
			
			{% if not user.is_authenticated %}
			<div class="hidden md:flex items-center space-x-8">			
				<a href="{% url 'account_login' %}" class="text-primary hover:text-secondary font-semibold transition-colors">
					Sign In
				</a>
				<a href="{% url 'account_signup' %}" class="bg-blue-600 text-white px-6 py-2.5 rounded-full font-medium hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
					Join Us
				</a>
			</div>
			{% endif %}

			<div class="md:hidden flex items-center">
				<button id="mobile-menu-btn" class="text-slate-500 hover:text-primary focus:outline-none p-2 rounded-md hover:bg-slate-100">
					<svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
					</svg>
				</button>
			</div>
		</div>
	</div>
	<!-- Mobile Menu Panel -->
	<div id="mobile-menu" class="hidden md:hidden bg-white border-t border-slate-100 absolute w-full shadow-xl">
		<div class="px-4 pt-4 pb-6 space-y-3">
			<a href="{% url 'account_login' %}" class="block px-3 py-3 rounded-lg text-center text-base font-bold text-primary bg-slate-50 hover:bg-slate-100">Sign In</a>
			<a href="{% url 'account_signup' %}" class="block px-3 py-3 rounded-lg text-center text-base font-bold bg-blue-600 text-white">Join Us</a>
		</div>
	</div>
</nav>
