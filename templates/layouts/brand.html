<div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-3">
    <button data-toggle="sidebar" data-target="#app-sidebar" class="p-2 text-slate-600 rounded-lg hover:bg-slate-100 lg:hidden" aria-label="Toggle Sidebar">
        <i class="fa-solid fa-bars text-lg"></i>
    </button>

    <a href="{{ app_home }}" class="flex min-w-0 items-center gap-2 rounded-lg sm:gap-3">
        {% if org.logo %}
            <img src="{{ org.logo_url }}" alt="{{ app_title }} logo" class="h-8 max-w-20 shrink-0 object-contain sm:h-10 sm:max-w-36">
        {% else %}
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-base font-bold text-white">
                {{ app_title|capfirst|slice:":1" }}
            </span>
        {% endif %}

        <span class="min-w-0">
            <span class="block truncate text-sm font-semibold tracking-tight text-slate-900 sm:text-lg">
                {{ app_title|capfirst }}
            </span>

            {% if org %}
                <span class="hidden max-w-48 truncate text-xs text-slate-500 sm:block">
                    {{ org.name }}
                </span>
            {% endif %}
        </span>
    </a>
</div>
