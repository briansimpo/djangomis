<div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-3">
    <button type="button" @click="sidebarOpen = !sidebarOpen" aria-label="Toggle navigation"
        class="inline-flex h-10 w-10 shrink-0 items-center justify-center
                rounded-xl text-slate-600 transition hover:bg-slate-100
                hover:text-slate-900 focus:outline-none
                focus-visible:ring-2 focus-visible:ring-indigo-500/30 lg:hidden" {% if app_name == "workspace" %} hidden {% endif %}>
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <a href="{{ app_home }}" class="flex min-w-0 items-center gap-2 rounded-lg sm:gap-3">
        {% if org.logo %}
            <img src="{{ org.logo_url }}" alt="{{ app_title }} logo" class="h-8 max-w-20 shrink-0 object-contain sm:h-10 sm:max-w-36">
        {% else %}
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-base font-bold text-white">
                {{ app_title|capfirst|slice:":1" }}
            </span>
        {% endif %}

        <span class="min-w-0">
            <span class="block truncate text-sm font-semibold tracking-tight text-slate-900 sm:text-lg">
                {{ app_title|capfirst }}
            </span>

            {% if org %}
                <span class="hidden max-w-48 truncate text-xs text-slate-500 sm:block">
                    {{ org.name }}
                </span>
            {% endif %}
        </span>
    </a>
</div>
