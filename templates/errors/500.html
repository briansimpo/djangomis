{% extends "errors/base.html" %}
{% load static %}
{% block content %}
    <div class="block md:max-w-lg">
        <img src="{% static 'img/illustrations/500.svg' %}" alt="500" class="w-auto h-96">
    </div>
    <div class="text-center xl:max-w-4xl">
        <h1 class="mb-3 text-2xl font-bold leading-tight text-gray-900 sm:text-4xl lg:text-5xl dark:text-white">Something has gone seriously wrong</h1>
        <p class="mb-5 text-xl font-normal text-gray-500 md:text-lg dark:text-gray-400">We track these errors automatically, but if the problem persists feel free to contact us. In the meantime, take time for a coffee break.</p>
    </div>
{% endblock %}
