{% load crispy_forms_tags %}

<div class="w-full overflow-hidden border border-gray-200 bg-white shadow-sm rounded-lg">
    <div id="form-container">
        
        <form action="{{ request.path }}" method="post" class="m-0">
            {% csrf_token %}

            <div class="px-8 py-8 bg-white">
                <div class="max-w-2xl">
                    <div class="space-y-4 text-gray-700">
                        {{ form|crispy }}
                    </div>
                </div>
            </div>

            <div class="flex gap-3 px-8 py-4 bg-gray-100 border-t border-gray-200">
                <button type="submit" class="btn btn-primary">
                    Save
                </button>
				<a href="{{cancel_url}}"  class="btn">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
